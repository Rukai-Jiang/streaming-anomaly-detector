[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-anomaly-detector"
version = "0.1.0"
description = "O(1) rolling z-score anomaly detection for metric streams"
requires-python = ">=3.11"

[project.scripts]
detect-anomalies = "anomaly_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

